name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTITY_REPOSITORY_TESTS: 'true'
      PLAYBACK_REPOSITORY_TESTS: 'true'
      IDENTITY_TEST_POSTGRES_HOST: 127.0.0.1
      PLAYBACK_TEST_POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/*.sbt
            project/build.properties
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
        with:
          disk-cache: false
      - name: Run all tests
        run: sbt --batch test
