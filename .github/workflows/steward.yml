name: Scala Steward

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scala-steward
  cancel-in-progress: false

jobs:
  scala-steward:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee
        with:
          branches: main
          do-not-fork: 'true'
