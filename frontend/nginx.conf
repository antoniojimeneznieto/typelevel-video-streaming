# Refresh Docker DNS when a backend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway_api {
  zone gateway_api 64k;
  server gateway-service:8084 resolve;
}

upstream video_storage {
  zone video_storage 64k;
  server seaweedfs:8333 resolve;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://gateway_api;
    add_header Cache-Control "no-store" always;
  }

  # Preserve the signed S3 path, query, and browser-facing Host header.
  # Keeping media on the frontend origin also works with private Codespaces ports.
  location ^~ /${S3_BUCKET}/ {
    access_log off;
    limit_except GET HEAD { deny all; }
    proxy_pass http://video_storage;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
