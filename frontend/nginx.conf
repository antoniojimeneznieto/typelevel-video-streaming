# Refresh Docker DNS when a backend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream identity_api {
  zone identity_api 64k;
  server identity-service:8081 resolve;
}

upstream catalog_api {
  zone catalog_api 64k;
  server catalog-service:8082 resolve;
}

upstream playback_api {
  zone playback_api 64k;
  server playback-service:8083 resolve;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/identity/ {
    proxy_pass http://identity_api/;
    add_header Cache-Control "no-store" always;
  }

  location /api/catalog/ {
    proxy_pass http://catalog_api/;
    add_header Cache-Control "no-store" always;
  }

  location /api/playback/ {
    proxy_pass http://playback_api/;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    return 404;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
