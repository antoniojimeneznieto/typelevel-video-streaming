name: typelevel-video-streaming

services:
  status-service:
    image: typelevel-video-streaming/status-service:local
    pull_policy: never
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${STATUS_SERVICE_PORT:-8080}:8080"
    restart: unless-stopped

  user-service:
    image: typelevel-video-streaming/user-service:local
    pull_policy: never
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: typelevel-video-streaming
      KEYCLOAK_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8082}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak/import:/opt/keycloak/data/import:ro
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  lgtm:
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "${LGTM_OTLP_UI_PORT:-3000}:3000"
      - "${LGTM_OTLP_GRPC_PORT:-4317}:4317"
      - "${LGTM_OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped