version = "3.11.1"
runner.dialect = scala3

align.preset = most
align.stripMargin = true
maxColumn = 100

runner.dialectOverride.allowSignificantIndentation = false

# aligns triple-quote """ and | in interpolated and raw string literals
assumeStandardLibraryStripMargin = true

rewrite.rules = [SortModifiers, Imports]
rewrite.imports.sort = ascii
rewrite.imports.groups = [["(?!javax?\\.).*", "(?!scala\\.).*"], ["javax?\\..*", "scala\\..*"]]

rewrite.trailingCommas.style = always

# Rewrites:
# - varargs: : _* or @ _* to *
# - imports: _ to * and => to as
# - wildcards: _ to ?
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.newSyntax.control = false
rewrite.scala3.newSyntax.deprecated = true
